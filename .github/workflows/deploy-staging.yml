name: Brasil SaaS ERP - Deploy Staging

on:
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: "Confirme que deseja implantar SOMENTE no staging (porta 8081)"
        required: true
        type: choice
        options:
          - "nao"
          - "sim"

permissions:
  contents: read

concurrency:
  group: brasil-saas-erp-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: inputs.confirm_staging_deploy == 'sim'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/resources/static/react/package-lock.json

      - name: Build frontend
        working-directory: src/main/resources/static/react
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build and verify Spring Boot JAR
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress clean package -DskipTests
          JAR="target/brasil-saas-erp-1.0.0-SNAPSHOT.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^BOOT-INF/'
          sha256sum "$JAR"

      - name: Verify staging prerequisites without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          STAGING_ENV=/etc/brasil-saas/staging.env
          test -r "$STAGING_ENV" || {
            echo "::error::Falta $STAGING_ENV. Configure credenciais e endpoints EXCLUSIVOS do staging antes do deploy."
            exit 1
          }
          sudo -n true || {
            echo "::error::O runner precisa de sudo não interativo restrito para instalar o artefato e gerenciar apenas o serviço de staging."
            exit 1
          }
          grep -Eq '^STAGING_ISOLATED_DB_CONFIRMED=true$' "$STAGING_ENV" || {
            echo "::error::Defina STAGING_ISOLATED_DB_CONFIRMED=true somente após confirmar que o banco é separado da produção."
            exit 1
          }
          grep -Eq '^SERVER_PORT=8081$' "$STAGING_ENV" || {
            echo "::error::O staging deve usar SERVER_PORT=8081; produção permanece na porta 8080."
            exit 1
          }
          grep -Eq '^(SPRING_DATASOURCE_URL|SPRING_DATASOURCE_JDBC_URL)=' "$STAGING_ENV" || {
            echo "::error::Configure a URL JDBC do banco de staging em $STAGING_ENV."
            exit 1
          }
          echo "Pré-requisitos presentes; valores secretos não serão exibidos."

      - name: Install staging release
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/brasil-saas-erp/staging
          sudo install -d -o euripedes -g euripedes -m 0750 "$BASE"
          sudo install -o euripedes -g euripedes -m 0640 \
            target/brasil-saas-erp-1.0.0-SNAPSHOT.jar \
            "$BASE/brasil-saas-erp-1.0.0-SNAPSHOT.jar"
          printf '%s\n' "$GITHUB_SHA" | sudo tee "$BASE/commit.txt" >/dev/null
          sudo chown euripedes:euripedes "$BASE/commit.txt"
          sudo tee /etc/systemd/system/brasil-saas-erp-staging.service >/dev/null <<'UNIT'
          [Unit]
          Description=Brasil SaaS ERP - Staging
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=euripedes
          Group=euripedes
          WorkingDirectory=/opt/brasil-saas-erp/staging
          EnvironmentFile=/etc/brasil-saas/staging.env
          ExecStart=/usr/lib/jvm/jdk-21.0.12.1-oracle-x64/bin/java -Xms256m -Xmx1536m -jar /opt/brasil-saas-erp/staging/brasil-saas-erp-1.0.0-SNAPSHOT.jar
          Restart=on-failure
          RestartSec=5
          SuccessExitStatus=143
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo systemctl daemon-reload
          sudo systemctl enable brasil-saas-erp-staging.service
          sudo systemctl restart brasil-saas-erp-staging.service

      - name: Verify staging health (production untouched)
        shell: bash
        run: |
          set -euo pipefail
          URL=http://127.0.0.1:8081/actuator/health
          READY=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 3 "$URL" -o /tmp/brasil-saas-staging-health.json; then
              READY=true
              break
            fi
            if ! sudo systemctl is-active --quiet brasil-saas-erp-staging.service; then
              sudo journalctl -u brasil-saas-erp-staging.service -n 100 --no-pager
              exit 1
            fi
            sleep 5
          done
          if [ "$READY" != true ]; then
            sudo journalctl -u brasil-saas-erp-staging.service -n 100 --no-pager
            echo "::error::Staging não ficou saudável em 5 minutos."
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('/tmp/brasil-saas-staging-health.json') as f:
              data = json.load(f)
          assert data.get('status') == 'UP', data
          print('Staging health: UP')
          PY
          echo "Produção: nenhuma ação sobre brasil-saas-erp.service; nenhuma chamada à porta 8080."

      - name: Verify production remained healthy
        run: |
          set -euo pipefail
          sudo systemctl is-active --quiet brasil-saas-erp.service
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/actuator/health
