name: BrasilCloud OpenRouter CI Auto Repair

on:
  workflow_run:
    workflows:
      - CI - Build and Test
      - Brasil SaaS ERP CI/CD Pipeline
      - CI - Code Quality Checks
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: openrouter-ci-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify agent secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY" || { echo "::error::OPENROUTER_API_KEY secret is missing."; exit 1; }
          test -n "$AGENT_GITHUB_TOKEN" || { echo "::error::AGENT_GITHUB_TOKEN secret is missing."; exit 1; }

      - name: Diagnose failed CI and propose repair PR
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: python .github/scripts/openrouter_ci_repair.py
