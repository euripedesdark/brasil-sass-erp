name: CI - Restore Sanitized Dump

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'dump-sanitizado-partes/**'
      - 'scripts/db/verificar_dump_sanitizado.py'
      - '.github/workflows/ci-dump-sanitizado.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-dump:
    name: Restore sanitized dump on PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erp_dump_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check all parts and allowed reference data
        run: python3 scripts/db/verificar_dump_sanitizado.py > /tmp/dump-manifest.json
      - name: Restore into the disposable database and verify every reference row
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          # The server and client both use PostgreSQL 18; production is never contacted.
          TABLES=$(docker exec "$PG_CONTAINER" psql -X -U postgres -d erp_dump_smoke -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema IN ('brasil_saas','dl')")
          test "$TABLES" = 0
          if ! cat dump-sanitizado-partes/parte-{00..13} | docker exec -i "$PG_CONTAINER" \
            psql -X -q -U postgres -d erp_dump_smoke --single-transaction -v ON_ERROR_STOP=1 \
            > /tmp/dump-restore.log 2>&1; then
            echo 'Dump restore failed; no data lines or SQL dump are published.'
            exit 1
          fi
          python3 - <<'PY'
          import json, os, subprocess
          manifest = json.load(open('/tmp/dump-manifest.json'))
          for table, expected in sorted(manifest['rows'].items()):
              result = subprocess.check_output([
                  'docker', 'exec', os.environ['PG_CONTAINER'], 'psql', '-X',
                  '-U', 'postgres', '-d', 'erp_dump_smoke', '-Atc',
                  'SELECT count(*) FROM ' + table], text=True)
              actual = int(result.strip())
              if actual != expected:
                  raise SystemExit('Reference row count differs: ' + table)
              print(table + ': ' + str(actual) + ' rows verified')
          print('PASS: full restore, constraints and all reference row counts verified')
          PY
