name: CI - Database Migration Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/main/resources/db/migration/**'
      - 'pom.xml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/main/resources/db/migration/**'
  workflow_dispatch:

concurrency:
  group: db-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-migrations:
    name: Test Database Migrations
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: brasil-saas
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: brasil-saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Test Flyway migrations
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/brasil-saas?currentSchema=brasil_saas
          SPRING_DATASOURCE_USERNAME: brasil-saas
          SPRING_DATASOURCE_PASSWORD: test123
          FLYWAY_URL: jdbc:postgresql://localhost:5432/brasil-saas?currentSchema=brasil_saas
          FLYWAY_USER: brasil-saas
          FLYWAY_PASSWORD: test123
        run: |
          set -euo pipefail
          PGPASSWORD="$FLYWAY_PASSWORD" psql -h localhost -U "$FLYWAY_USER" -d brasil-saas -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS brasil_saas;"
          

          # First, try to apply all migrations
          mvn -B -ntp flyway:migrate -Dflyway.url="$FLYWAY_URL" -Dflyway.user="$FLYWAY_USER" -Dflyway.password="$FLYWAY_PASSWORD" -Dflyway.schemas=brasil_saas -Dflyway.ignoreMigrationPatterns=17:ignored
          
          # Check if migrations were applied successfully
          PGPASSWORD=$FLYWAY_PASSWORD psql -h localhost -U $FLYWAY_USER -d brasil-saas -c "\dt" > tables.txt
          
          # Count applied migrations
          APPLIED=$(PGPASSWORD=$FLYWAY_PASSWORD psql -h localhost -U $FLYWAY_USER -d brasil-saas -t -c "SELECT COUNT(*) FROM brasil_saas.flyway_schema_history")
          echo "Applied migrations: $APPLIED"
          
          # Verify all expected tables exist
          EXPECTED_TABLES=("empresa" "usuario" "pessoa" "cliente" "fornecedor" "produto" "titulo" "lancamento_contabil")
          for table in "${EXPECTED_TABLES[@]}"; do
            if ! grep -q "$table" tables.txt; then
              echo "ERROR: Table $table not found!"
              exit 1
            fi
          done
          
          echo "All migrations applied successfully!"

      - name: Validate migration SQL syntax
        run: |
          # Find all migration files
          MIGRATION_FILES=$(find src/main/resources/db/migration -name "V*.sql")
          
          for file in $MIGRATION_FILES; do
            echo "Validating $file..."
            # Basic syntax check - try to parse with pg_dump
            # This is a simple check, for more thorough validation we'd need a real DB
            if ! grep -q "^--" "$file" && ! grep -q "^CREATE" "$file" && ! grep -q "^ALTER" "$file" && ! grep -q "^INSERT" "$file"; then
              echo "WARNING: $file may have invalid SQL"
            fi
          done

      - name: Check migration ordering
        run: |
          # Verify migrations are numbered correctly
          MIGRATIONS=$(ls src/main/resources/db/migration/V*.sql | sort -V)
          PREV_VERSION=0
          
          for migration in $MIGRATIONS; do
            # Extract version number
            VERSION=$(basename "$migration" | sed 's/V\([0-9]*\).*/\1/')
            
            if [ "$VERSION" -le "$PREV_VERSION" ]; then
              echo "ERROR: Migration versions are not in order!"
              echo "Previous: V$PREV_VERSION, Current: V$VERSION"
              exit 1
            fi
            
            PREV_VERSION=$VERSION
          done
          
          echo "Migration ordering is correct!"

  test-migration-rollback:
    name: Test Migration Rollback
    runs-on: ubuntu-latest
    needs: test-migrations
    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: brasil-saas
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: brasil-saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize rollback database schema
        env:
          PGPASSWORD: test123
        run: |
          set -euo pipefail
          psql -h localhost -U brasil-saas -d brasil-saas -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS brasil_saas;"

      - name: Test rollback capability
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/brasil-saas?currentSchema=brasil_saas
          FLYWAY_USER: brasil-saas
          FLYWAY_PASSWORD: test123
        run: |
          set -euo pipefail
          PGPASSWORD="$FLYWAY_PASSWORD" psql -h localhost -U "$FLYWAY_USER" -d brasil-saas -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS brasil_saas;"
          
          # Apply all migrations
          mvn flyway:migrate -Dflyway.url=$FLYWAY_URL -Dflyway.user=$FLYWAY_USER -Dflyway.password=$FLYWAY_PASSWORD -Dflyway.ignoreMigrationPatterns=17:ignored
          
          # Get the latest migration
          LATEST_VERSION=$(PGPASSWORD=$FLYWAY_PASSWORD psql -h localhost -U $FLYWAY_USER -d brasil-saas -t -c "SELECT version FROM brasil_saas.flyway_schema_history ORDER BY installed_rank DESC LIMIT 1" | tr -d ' ')
          
          echo "Latest migration: $LATEST_VERSION"
          
          # Test info command
          mvn flyway:info -Dflyway.url=$FLYWAY_URL -Dflyway.user=$FLYWAY_USER -Dflyway.password=$FLYWAY_PASSWORD
          
          # Test validate command
          mvn flyway:validate -Dflyway.url=$FLYWAY_URL -Dflyway.user=$FLYWAY_USER -Dflyway.password=$FLYWAY_PASSWORD
          
          echo "Flyway validation successful!"
