name: CI - Self-hosted ERP build

on:
  push:
    branches:
      - main
      - fix/self-hosted-runner-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build React frontend and Spring Boot JAR
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/resources/static/react/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/main/resources/static/react
        run: npm ci

      - name: Build frontend
        working-directory: src/main/resources/static/react
        run: npm run build

      - name: Package Spring Boot application
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Validate packaged JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/brasil-saas-erp-1.0.0-SNAPSHOT.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^BOOT-INF/'
          sha256sum "$JAR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: brasil-saas-erp-${{ github.sha }}
          path: target/brasil-saas-erp-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7
