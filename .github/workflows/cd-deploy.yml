name: CD - Deploy to Production

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/main/resources/static/react/package-lock.json

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Node.js dependencies
        run: |
          cd src/main/resources/static/react
          npm ci
          cd ../../../../

      - name: Build frontend
        run: |
          cd src/main/resources/static/react
          npm run build
          cd ../../../../

      - name: Build backend
        run: mvn clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: Dockerfile

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    needs: build-docker-image
    environment:
      name: staging
      url: https://staging.brasil-saaserp.com
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate staging secrets
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          [ -n "$STAGING_HOST" ] || { echo "::error::Missing STAGING_HOST"; exit 1; }
          [ -n "$STAGING_USER" ] || { echo "::error::Missing STAGING_USER"; exit 1; }
          [ -n "$STAGING_SSH_KEY" ] || { echo "::error::Missing STAGING_SSH_KEY"; exit 1; }

      - name: Deploy to Staging Server
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            cd /opt/brasil-saas-erp
            docker-compose pull
            docker-compose up -d --build
            docker system prune -f

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
    needs: build-docker-image
    environment:
      name: production
      url: https://brasil-saaserp.com
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production secrets
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          [ -n "$PRODUCTION_HOST" ] || { echo "::error::Missing PRODUCTION_HOST"; exit 1; }
          [ -n "$PRODUCTION_USER" ] || { echo "::error::Missing PRODUCTION_USER"; exit 1; }
          [ -n "$PRODUCTION_SSH_KEY" ] || { echo "::error::Missing PRODUCTION_SSH_KEY"; exit 1; }

      - name: Deploy to Production Server
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            cd /opt/brasil-saas-erp
            docker-compose pull
            docker-compose up -d --build
            docker system prune -f

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    continue-on-error: true
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
      - name: Send Slack Notification
        if: env.SLACK_WEBHOOK != ''
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "Brasil SaaS ERP Deployment"
          SLACK_MESSAGE: |
            Deployment ${{ job.status }} to ${{ github.event.inputs.environment || 'production' }}
            Commit: ${{ github.sha }}
            Repository: ${{ github.repository }}
