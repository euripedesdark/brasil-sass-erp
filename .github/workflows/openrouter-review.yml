name: OpenRouter PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: openrouter-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base confiável
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar diff e script confiável
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/review-head"
          git diff --no-ext-diff --unified=20 "${BASE_SHA}...refs/remotes/pull/review-head" -- > "${TEMP_DIR}/pr.diff"
          if git cat-file -e "${BASE_SHA}:.github/scripts/openrouter_review.py" 2>/dev/null; then
            git show "${BASE_SHA}:.github/scripts/openrouter_review.py" > "${TEMP_DIR}/openrouter_review.py"
          else
            printf '%s\n' 'from pathlib import Path' 'import os' 'Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("## Agente OpenRouter\n\nO workflow foi introduzido nesta PR. A análise por IA ficará ativa nas próximas PRs após o merge inicial.\n", encoding="utf-8")' > "${TEMP_DIR}/openrouter_review.py"
          fi
          echo "Diff preparado: $(wc -c < "${TEMP_DIR}/pr.diff") bytes."

      - name: Revisar diff com OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          DIFF_PATH: ${{ runner.temp }}/pr.diff
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: python3 "${{ runner.temp }}/openrouter_review.py"
